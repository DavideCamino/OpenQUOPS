[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "OpenQUOPS"
version = "0.1.0"
description = "Quadratic optimization with exhaustive search, annealing, and QAOA."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
       { name = "Davide Camino" },
]
dependencies = [
    "numpy==2.5.4",
    "pandas==3.0.6",
    "qubovert==1.2.5",
]

[project.optional-dependencies]
annealing = [
    "dimod==0.12.22",
    "dwave-samplers==1.8.0",
]
qaoa = [
    "scipy==1.18.1",
    "qiskit==2.5.2",
    "qiskit-aer==0.17.2",
    "qiskit-ibm-runtime==0.50.0",
]
all = [
    "dimod==0.12.22",
    "dwave-samplers==1.8.0",
    "scipy==1.18.1",
    "qiskit==2.5.2",
    "qiskit-aer==0.17.2",
    "qiskit-ibm-runtime==0.50.0",
]
dev = ["build>=1.2", "pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["oquops*"]
namespaces = false
